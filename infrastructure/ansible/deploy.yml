---
- name: Deploy Library Hall Booking System
  hosts: app
  gather_facts: yes
  vars:
    project_dir: "/home/{{ ansible_user }}/library-room-booking"
    compose_file: "docker-compose.prod.yml"
    env_file_local: "./files/prod.env"
    project_root_local: "{{ playbook_dir }}/../.."

  tasks:
    - name: Wait for cloud-init (Docker install) to finish
      become: yes
      wait_for:
        path: /var/lib/cloud/instance/boot-finished
        timeout: 300

    - name: Verify Docker is installed
      command: docker --version
      register: docker_check
      changed_when: false

    - name: Show Docker version
      debug:
        var: docker_check.stdout

    - name: Ensure project directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Rsync project files from local machine to remote
      delegate_to: localhost
      become: no
      shell: >-
        rsync -az --delete
        --exclude='node_modules'
        --exclude='dist'
        --exclude='.git'
        --exclude='.terraform'
        --exclude='*.tfstate*'
        --exclude='.terraform.lock.hcl'
        --exclude='terraform.tfvars'
        --exclude='infrastructure/ansible/files/prod.env'
        --exclude='infrastructure/ansible/inventory.ini'
        --exclude='backend/.env'
        --exclude='frontend/.env'
        --exclude='.env'
        --exclude='.DS_Store'
        -e "ssh -i {{ ansible_ssh_private_key_file }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        "{{ project_root_local }}/"
        "{{ ansible_user }}@{{ inventory_hostname }}:{{ project_dir }}/"

    - name: Copy production env file
      copy:
        src: "{{ env_file_local }}"
        dest: "{{ project_dir }}/.env"
        mode: '0600'
        owner: "{{ ansible_user }}"

    - name: Add ubuntu user to docker group (idempotent)
      become: yes
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Build & start containers
      become: yes
      shell: docker compose -f {{ compose_file }} up -d --build
      args:
        chdir: "{{ project_dir }}"
      register: compose_up

    - name: Show running containers
      become: yes
      shell: docker compose -f {{ compose_file }} ps
      args:
        chdir: "{{ project_dir }}"
      register: ps_output
      changed_when: false

    - name: Display container status
      debug:
        var: ps_output.stdout_lines

    - name: App reachable on
      debug:
        msg:
          - "Frontend:    http://{{ inventory_hostname }}"
          - "Backend:     http://{{ inventory_hostname }}:5000/health"
          - "Prometheus:  http://{{ inventory_hostname }}:9090"
          - "Grafana:     http://{{ inventory_hostname }}:3000"
