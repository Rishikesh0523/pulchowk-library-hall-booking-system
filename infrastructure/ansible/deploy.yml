---
- name: Deploy Library Hall Booking System
  hosts: app
  become: yes
  vars:
    project_repo: "https://github.com/CHANGE_ME/library-room-booking.git"
    project_branch: "main"
    project_dir: "/opt/library-room-booking"
    compose_file: "docker-compose.prod.yml"
    env_file_local: "./files/prod.env"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker engine and compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Clone or update project repo
      git:
        repo: "{{ project_repo }}"
        dest: "{{ project_dir }}"
        version: "{{ project_branch }}"
        force: yes

    - name: Copy production env file
      copy:
        src: "{{ env_file_local }}"
        dest: "{{ project_dir }}/.env"
        mode: '0600'

    - name: Pull container images (if pre-built)
      shell: docker compose -f {{ compose_file }} pull || true
      args:
        chdir: "{{ project_dir }}"

    - name: Build & start containers
      shell: docker compose -f {{ compose_file }} up -d --build
      args:
        chdir: "{{ project_dir }}"

    - name: Show running containers
      shell: docker compose -f {{ compose_file }} ps
      args:
        chdir: "{{ project_dir }}"
      register: ps_output

    - name: Display container status
      debug:
        var: ps_output.stdout_lines
